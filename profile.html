<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CivicLens - Profile</title>

    <link rel="stylesheet"
          href="dashboard.css">

    <style>

        .profile-page {
            max-width: 900px;
        }

        .profile-title {
            margin-bottom: 30px;
        }

        .profile-title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .profile-title p {
            color: #71817c;
            font-size: 14px;
        }

        .profile-card {
            background: white;

            border: 1px solid #e2e8e5;

            border-radius: 14px;

            padding: 35px;
        }

        .profile-header {
            display: flex;
            align-items: center;

            gap: 20px;

            padding-bottom: 30px;

            border-bottom: 1px solid #edf1ef;

            margin-bottom: 30px;
        }

        .large-profile-circle {
            width: 78px;
            height: 78px;

            border-radius: 50%;

            background: #14765b;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            font-weight: bold;
        }

        .profile-header h2 {
            font-size: 23px;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #7b8985;
            font-size: 14px;
        }

        .profile-details {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 22px;
        }

        .profile-field {
            background: #f7f9f8;

            border-radius: 9px;

            padding: 18px;
        }

        .profile-field label {
            display: block;

            color: #7a8985;

            font-size: 12px;

            margin-bottom: 8px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }

        .profile-field span {
            color: #1b342e;

            font-size: 15px;

            font-weight: 600;
        }

        .profile-note {
            margin-top: 25px;

            padding: 15px;

            background: #edf7f3;

            border-left: 4px solid #14765b;

            color: #49645b;

            font-size: 13px;

            line-height: 1.6;
        }

        @media(max-width: 650px) {

            .profile-details {
                grid-template-columns: 1fr;
            }

            .profile-card {
                padding: 25px;
            }

        }

    </style>

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-circle">•</div>
            <span>CivicLens</span>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html"
               class="nav-item">

                <span class="nav-icon">⌂</span>
                <span>Dashboard</span>

            </a>

            <a href="report.html"
               class="nav-item">

                <span class="nav-icon">＋</span>
                <span>Report Issue</span>

            </a>

            <a href="my-reports.html"
               class="nav-item">

                <span class="nav-icon">▣</span>
                <span>My Reports</span>

            </a>

            <a href="profile.html"
               class="nav-item active">

                <span class="nav-icon">◉</span>
                <span>Profile</span>

            </a>

        </nav>

        <div class="sidebar-bottom">

            <button class="logout-btn"
                    id="logoutBtn">

                ↪ Logout

            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

        <div class="profile-page">

            <div class="profile-title">

                <p class="dashboard-label">
                    ACCOUNT
                </p>

                <h1>My Profile</h1>

                <p>
                    View your CivicLens account information.
                </p>

            </div>


            <div class="profile-card">

                <div class="profile-header">

                    <div class="large-profile-circle"
                         id="largeProfileInitial">

                        C

                    </div>

                    <div>

                        <h2 id="profileName">
                            Citizen
                        </h2>

                        <p>
                            CivicLens Citizen Account
                        </p>

                    </div>

                </div>


                <div class="profile-details">

                    <div class="profile-field">

                        <label>Full Name</label>

                        <span id="profileFullName">
                            Citizen
                        </span>

                    </div>


                    <div class="profile-field">

                        <label>Email / Phone</label>

                        <span id="profileContact">
                            Not available
                        </span>

                    </div>


                    <div class="profile-field">

                        <label>Account Type</label>

                        <span>
                            Citizen
                        </span>

                    </div>


                    <div class="profile-field">

                        <label>Reports Submitted</label>

                        <span id="profileReportCount">
                            0
                        </span>

                    </div>

                </div>


                <div class="profile-note">

                    Your profile information is based on the
                    account you used to register with CivicLens.

                </div>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
