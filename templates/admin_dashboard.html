<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicLens Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  </head>
  <body class="bg-light">
    <div class="app-shell">
      <aside class="sidebar bg-dark text-white">
        <div class="p-4 border-bottom border-secondary">
          <h3 class="mb-0 fw-bold">CivicLens</h3>
          <small class="text-secondary">Admin Console</small>
        </div>

        <nav class="nav flex-column p-3">
          <a class="nav-link active" href="/admin">Dashboard</a>
          <a class="nav-link" href="/admin">All Issues</a>
          <a class="nav-link" href="/auth/login">Logout</a>
        </nav>
      </aside>

      <main class="main-panel">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3">
          <div class="container-fluid">
            <span class="navbar-brand mb-0 h4 fw-bold">Dashboard Overview</span>
            <div class="ms-auto">
              <a href="/auth/login" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
          </div>
        </nav>

        <div class="container-fluid px-4 py-4">
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
              <p class="text-muted mb-1">Civic Operations</p>
              <h2 class="fw-bold mb-0">Admin Dashboard</h2>
            </div>
          </div>

          <div class="row g-4 mb-4" id="statsCards">
            <div class="col-md-6 col-xl-2">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                  <div class="text-muted small text-uppercase">Total Issues</div>
                  <div class="display-6 fw-bold mt-2" id="totalIssues">0</div>
                </div>
              </div>
            </div>
            <div class="col-md-6 col-xl-2">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                  <div class="text-muted small text-uppercase">Reported</div>
                  <div class="display-6 fw-bold mt-2 text-secondary" id="reportedCount">0</div>
                </div>
              </div>
            </div>
            <div class="col-md-6 col-xl-2">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                  <div class="text-muted small text-uppercase">Under Review</div>
                  <div class="display-6 fw-bold mt-2 text-warning" id="underReviewCount">0</div>
                </div>
              </div>
            </div>
            <div class="col-md-6 col-xl-2">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                  <div class="text-muted small text-uppercase">In Progress</div>
                  <div class="display-6 fw-bold mt-2 text-primary" id="inProgressCount">0</div>
                </div>
              </div>
            </div>
            <div class="col-md-6 col-xl-2">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                  <div class="text-muted small text-uppercase">Resolved</div>
                  <div class="display-6 fw-bold mt-2 text-success" id="resolvedCount">0</div>
                </div>
              </div>
            </div>
          </div>

          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="row g-3 align-items-end mb-3">
                <div class="col-md-5">
                  <label class="form-label fw-semibold">Search</label>
                  <input type="text" id="searchInput" class="form-control" placeholder="Search by description, category, location, or citizen" />
                </div>
                <div class="col-md-3">
                  <label class="form-label fw-semibold">Status</label>
                  <select id="statusFilter" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="Reported">Reported</option>
                    <option value="Under Review">Under Review</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label fw-semibold">Category</label>
                  <select id="categoryFilter" class="form-select">
                    <option value="">All Categories</option>
                    <option value="Pothole">Pothole</option>
                    <option value="Garbage Accumulation">Garbage Accumulation</option>
                    <option value="Broken Streetlight">Broken Streetlight</option>
                    <option value="Water Leakage">Water Leakage</option>
                    <option value="Damaged Road">Damaged Road</option>
                    <option value="Overflowing Drain">Overflowing Drain</option>
                    <option value="Damaged Public Property">Damaged Public Property</option>
                  </select>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table align-middle table-hover mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>ID</th>
                      <th>Category</th>
                      <th>Citizen</th>
                      <th>Location</th>
                      <th>Status</th>
                      <th>Created</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="issuesTableBody">
                    <tr>
                      <td colspan="7" class="text-center text-muted py-4">Loading issues...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  </body>
</html>
