<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CivicLens{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg civic-nav">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('dashboard.dashboard') }}">Civic<span>Lens</span></a>
      <div class="d-flex align-items-center gap-3">
        <a class="nav-link" href="{{ url_for('dashboard.my_issues') }}">My Complaints</a>
        <a class="btn btn-light btn-sm" href="/citizen/report">Report Issue</a>
        <a class="nav-link" href="/auth/logout">Logout</a>
      </div>
    </div>
  </nav>
  <main class="container py-4 py-lg-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert alert-{{ category }}" role="alert">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
