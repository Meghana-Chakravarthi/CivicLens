<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issue Details | CivicLens Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
          <p class="text-muted mb-1">Issue Management</p>
          <h2 class="fw-bold mb-0">Issue Details</h2>
        </div>
        <a href="/admin" class="btn btn-outline-secondary">Back to Dashboard</a>
      </div>

      <div id="issueDetailContainer" data-issue-id="{{ issue_id }}">
        <div class="alert alert-info">Loading issue details...</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  </body>
</html>
